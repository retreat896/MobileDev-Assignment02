<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4ff;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        h1.title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
            text-align: center;
            color: #000;
        }

        .status {
            font-size: 14px;
            text-align: center;
            margin-bottom: 12px;
            color: #333;
        }

        #messages-container {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px;
            background-color: #ffffff;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message-bubble {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message-from {
            font-size: 10px;
            opacity: 0.6;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .message-text {
            font-size: 14px;
        }

        .message-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 4px;
        }

        .msg-me {
            align-self: flex-end;
            background-color: #d4f8d4;
        }

        .msg-user {
            align-self: flex-start;
            background-color: #fccddcff;
        }

        .msg-server {
            align-self: center;
            background-color: #d4e4ff;
        }

        .msg-system {
            align-self: center;
            background-color: #fce5cd;
            font-style: italic;
        }

        .input-row {
            display: flex;
            flex-direction: row;
            margin-top: 8px;
            align-items: center;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            border: 1px solid #aaa;
            border-radius: 6px;
            padding: 10px 8px;
            background-color: #ffffff;
            font-size: 16px;
        }

        button {
            padding: 10px 16px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            opacity: 0.7;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .button-row {
            margin-top: 8px;
        }

        .reconnect-btn {
            width: 100%;
            background-color: #2196F3;
        }

        #username-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        #username-screen .title {
            margin-bottom: 20px;
        }

        #username-screen .input-row {
            width: 100%;
            max-width: 400px;
        }

        #chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #chat-screen.active {
            display: flex;
        }

        #media-bar {
            display: flex;
            overflow-x: auto;
            margin-bottom: 8px;
            gap: 10px;
            scrollbar-width: thin;
        }

        .media-thumbnail {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .media-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-thumbnail .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background-color: rgba(221, 136, 136, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .add-media-btn {
            padding: 10px;
            background-color: #007AFF;
            min-width: 44px;
        }

        #file-input {
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
            display: none;
        }

        .progress-bar.visible {
            display: block;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #007AFF;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Username Entry Screen -->
        <div id="username-screen">
            <h1 class="title">Enter a username to join the chat!</h1>
            <div class="input-row">
                <input type="text" id="username-entry-input" placeholder="Enter your name..." maxlength="16" />
                <button id="join-btn">Send</button>
            </div>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen">
            <h1 class="title">WebSocket Chat</h1>
            <div class="status" id="status-text">Status: 😔 Disconnected</div>

            <div class="progress-bar" id="upload-progress">
                <div class="progress-bar-fill" id="upload-progress-fill"></div>
            </div>

            <div id="messages-container"></div>

            <!-- Media Bar -->
            <div id="media-bar"></div>

            <div class="input-row">
                <input type="file" id="file-input" accept="image/*" multiple />
                <button id="add-media-btn" class="add-media-btn">+</button>
                <input type="text" id="message-input" placeholder="Type a message..." />
                <button id="send-btn">Send</button>
            </div>

            <div class="button-row">
                <button id="reconnect-btn" class="reconnect-btn">Reconnect</button>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const USERNAME_KEY = 'chat_username';
        const WS_TOKEN_KEY = 'ws_token';
        const WS_TOKEN_EXPIRY_KEY = 'ws_token_expiry';
        
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.host;
        const BASE_URL = `${window.location.protocol}//${host}`;
        const WS_URL = `${protocol}//${host}/ws`;

        // --- State ---
        let wsUpload = null;
        let wsDownload = null;
        let isConnected = false;
        let username = '';
        let authToken = null;
        let inputMedia = [];
        let downloads = new Map();
        let downloadTimeouts = new Map();
        let fileQueue = [];
        let bytesUpload = 0;
        let totalUploadBytes = 0;

        // --- DOM Elements ---
        const usernameScreen = document.getElementById('username-screen');
        const usernameEntryInput = document.getElementById('username-entry-input');
        const joinBtn = document.getElementById('join-btn');
        const chatScreen = document.getElementById('chat-screen');
        const statusText = document.getElementById('status-text');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const reconnectBtn = document.getElementById('reconnect-btn');
        const mediaBar = document.getElementById('media-bar');
        const addMediaBtn = document.getElementById('add-media-btn');
        const fileInput = document.getElementById('file-input');
        const uploadProgress = document.getElementById('upload-progress');
        const uploadProgressFill = document.getElementById('upload-progress-fill');

        // --- Username Management ---
        function loadUsername() {
            const stored = localStorage.getItem(USERNAME_KEY);
            if (stored) {
                usernameEntryInput.value = stored;
            } else {
                usernameEntryInput.value = 'User' + Math.floor(Math.random() * 100);
            }
        }

        function saveUsername(name) {
            localStorage.setItem(USERNAME_KEY, name);
        }

        async function handleJoinChat() {
            const name = usernameEntryInput.value.trim();
            if (name.length > 2 && name.length <= 16) {
                username = name;
                saveUsername(name);
                usernameScreen.style.display = 'none';
                chatScreen.classList.add('active');
                await connectWebSocket();
            } else {
                alert('Username must be between 3 and 16 characters');
            }
        }

        // --- Token Management ---
        async function getAuthToken() {
            const storedToken = localStorage.getItem(WS_TOKEN_KEY);
            const expiryStr = localStorage.getItem(WS_TOKEN_EXPIRY_KEY);

            if (storedToken && expiryStr) {
                const expiry = parseInt(expiryStr);
                if (Date.now() < expiry - (24 * 60 * 60 * 1000)) {
                    console.log('Using existing token');
                    return storedToken;
                }
            }

            console.log('Requesting new token from server...');
            try {
                const response = await fetch(`${BASE_URL}/ws/auth/token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username: username })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const newToken = data.token;
                const expiresIn = data.expires_in * 1000;

                localStorage.setItem(WS_TOKEN_KEY, newToken);
                localStorage.setItem(WS_TOKEN_EXPIRY_KEY, (Date.now() + expiresIn).toString());

                console.log('Received new token');
                return newToken;
            } catch (error) {
                console.error('Failed to get auth token:', error);
                throw error;
            }
        }

        // --- WebSocket Connection ---
        async function connectWebSocket() {
            if (wsUpload) wsUpload.close();
            if (wsDownload) wsDownload.close();

            try {
                const token = await getAuthToken();
                authToken = token;

                console.log('Connecting to WebSocket...');
                wsUpload = new WebSocket(`${WS_URL}/upload?token=${token}`);
                wsDownload = new WebSocket(`${WS_URL}/download?token=${token}`);

                wsDownload.onopen = () => {
                    console.log('Download WebSocket connected');
                    updateStatus(true);
                    addSystemMessage('Connected to server.');
                };

                wsUpload.onopen = () => {
                    console.log('Upload WebSocket connected');
                };

                wsDownload.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    const eventType = data.event_type;

                    if (eventType && eventType.startsWith('file')) {
                        handleDownload(eventType, data);
                    } else if (eventType === 'message') {
                        handleMessage(data);
                    }
                };

                wsDownload.onerror = () => {};
                wsUpload.onerror = () => {};

                wsDownload.onclose = async (event) => {
                    console.log('Download WebSocket closed');
                    updateStatus(false);
                    addSystemMessage('Disconnected from server.');
                    console.log(event)
                    if (event.code === 1008 || event.reason?.includes('403')) {
                        localStorage.removeItem(WS_TOKEN_KEY);
                        localStorage.removeItem(WS_TOKEN_EXPIRY_KEY);
                        console.log('Attempting to reconnect with new token');
                        await connectWebSocket();
                    }
                };

            } catch (error) {
                console.error('Failed to connect:', error);
                addSystemMessage('Failed to connect to server.');
            }
        }

        // --- Message Handling ---
        function updateStatus(connected) {
            isConnected = connected;
            statusText.textContent = connected ? 'Status: 😃 Connected' : 'Status: 😔 Disconnected';
        }

        function addSystemMessage(text) {
            addMessage('system', 'message', text);
        }

        function addMessage(from, eventType, payload, timestamp = Date.now()) {
            const bubble = document.createElement('div');
            
            let variantClass = 'msg-system';
            if (from === username || from === 'me') {
                variantClass = 'msg-me';
            } else if (from === 'system') {
                variantClass = 'msg-system';
            } else if (from === 'server') {
                variantClass = 'msg-server';
            } else {
                variantClass = 'msg-user';
            }

            bubble.className = `message-bubble ${variantClass}`;

            const fromSpan = document.createElement('span');
            fromSpan.className = 'message-from';
            fromSpan.textContent = from.toUpperCase() + ':';
            bubble.appendChild(fromSpan);

            if (eventType === 'message') {
                const textSpan = document.createElement('span');
                textSpan.className = 'message-text';
                textSpan.textContent = typeof payload === 'object' ? payload.text : payload;
                bubble.appendChild(textSpan);
            } else if (eventType === 'file') {
                const img = document.createElement('img');
                img.className = 'message-image';
                img.src = payload;
                bubble.appendChild(img);
            }

            messagesContainer.appendChild(bubble);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handleMessage(data) {
            const sender = data.username;
            const text = data.payload.text;
            const timestamp = data.payload.timestamp;
            addMessage(sender, 'message', data.payload, timestamp);
        }

        async function handleDownload(eventType, data) {
            const sender = data.username;
            const fileName = data.payload.file_name;
            const bytes = data.payload.bytes;
            
            const fileKey = `${sender.padEnd(12, ' ').substring(0, 13).trim()}_${fileName}`;
            let file = downloads.get(fileKey);

            if (file) {
                file.buffer.set(bytes, file.offset);
                file.offset += bytes.length;
                file.lastUpdated = Date.now();

                if (downloadTimeouts.has(fileKey)) {
                    clearTimeout(downloadTimeouts.get(fileKey));
                }

                const timeoutId = setTimeout(() => {
                    const timeSinceUpdate = Date.now() - file.lastUpdated;
                    if (timeSinceUpdate >= 10000) {
                        console.warn(`Download timeout for file: ${fileKey}`);
                        downloads.delete(fileKey);
                        downloadTimeouts.delete(fileKey);
                    }
                }, 15000);
                
                downloadTimeouts.set(fileKey, timeoutId);
            }

            if (eventType === 'file_start') {
                const filesize = data.payload.size;
                const timestamp = data.payload.timestamp;
                const serverHash = data.payload.hash;
                const algorithm = data.payload.algorithm;

                downloads.set(fileKey, {
                    buffer: new Uint8Array(filesize),
                    offset: 0,
                    lastUpdated: Date.now(),
                    timestamp: timestamp,
                    size: filesize,
                    expectedHash: serverHash,
                    algorithm: algorithm
                });

                const newDownload = downloads.get(fileKey);
                newDownload.buffer.set(bytes, 0);
                newDownload.offset = bytes.length;
            } else if (file && eventType === 'file_end') {
                console.log('File successfully received!');
                
                const blob = new Blob([file.buffer], { type: 'image/jpeg' });
                const url = URL.createObjectURL(blob);
                
                addMessage(sender, 'file', url, file.timestamp);
                downloads.delete(fileKey);
            }
        }

        // --- Sending Messages ---
        async function sendPayload(eventType, payload) {
            if (!wsUpload || wsUpload.readyState !== WebSocket.OPEN) {
                addSystemMessage('Not connected. Trying to reconnect...');
                await connectWebSocket();
                return;
            }

            const data = {
                username: username,
                event_type: eventType,
                payload: payload
            };

            wsUpload.send(JSON.stringify(data));
        }

        async function sendByteChunk(filename, bytes, size, md5Hash = null) {
            const CHUNK_SIZE = 1024 * 64;
            const MAX_BUFFER_SIZE = 1024 * 1024;

            const bufferedAmount = wsUpload?.bufferedAmount || 0;
            
            if (bufferedAmount > MAX_BUFFER_SIZE) {
                await new Promise(resolve => setTimeout(resolve, 10));
                return bytes;
            }

            const chunk = bytes.slice(0, CHUNK_SIZE);
            const payload = {
                file_name: filename,
                bytes: Array.from(chunk)
            };
            
            let eventType = 'file';

            if (size === bytes.length) {
                eventType = 'file_start';
            } else if (bytes.length <= CHUNK_SIZE) {
                eventType = 'file_end';
                if (md5Hash) {
                    payload.hash = md5Hash;
                    payload.algorithm = 'md5';
                }
            }

            await sendPayload(eventType, payload);

            bytesUpload += chunk.length;
            updateUploadProgress();

            return bytes.subarray(CHUNK_SIZE);
        }

        function updateUploadProgress() {
            if (totalUploadBytes > 0) {
                const progress = (bytesUpload / totalUploadBytes) * 100;
                uploadProgressFill.style.width = progress + '%';
                uploadProgress.classList.add('visible');
            } else {
                uploadProgress.classList.remove('visible');
            }
        }

        async function sendQueuedFiles() {
            if (!fileQueue || fileQueue.length === 0) {
                totalUploadBytes = 0;
                bytesUpload = 0;
                updateUploadProgress();
                return;
            }

            const file = fileQueue.shift();
            const arrayBuffer = await file.arrayBuffer();
            let bytes = new Uint8Array(arrayBuffer);
            
            while (bytes.length > 0) {
                bytes = await sendByteChunk(file.name, bytes, file.size);
                await new Promise(r => setTimeout(r, 0));
            }

            addMessage('me', 'file', URL.createObjectURL(file));
            inputMedia = inputMedia.filter(f => f !== file);
            updateMediaBar();

            await sendQueuedFiles();
        }

        async function sendMessage() {
            if (inputMedia.length > 0) {
                bytesUpload = 0;
                totalUploadBytes = 0;
                
                for (let file of inputMedia) {
                    totalUploadBytes += file.size;
                    fileQueue.push(file);
                }
                
                updateUploadProgress();
                await sendQueuedFiles();
            }

            const text = messageInput.value.trim();
            if (text) {
                await sendPayload('message', { text: text });
                messageInput.value = '';
                addMessage('me', 'message', text);
            }
        }

        // --- Media Handling ---
        function updateMediaBar() {
            mediaBar.innerHTML = '';
            
            inputMedia.forEach((file, index) => {
                const thumbnail = document.createElement('div');
                thumbnail.className = 'media-thumbnail';
                
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '×';
                removeBtn.onclick = () => {
                    inputMedia.splice(index, 1);
                    updateMediaBar();
                };
                
                thumbnail.appendChild(img);
                thumbnail.appendChild(removeBtn);
                mediaBar.appendChild(thumbnail);
            });
        }

        function addMediaInput(files) {
            for (let file of files) {
                if (!inputMedia.includes(file) && inputMedia.length < 4) {
                    inputMedia.push(file);
                }
            }
            updateMediaBar();
        }

        // --- Event Listeners ---
        window.addEventListener('load', loadUsername);

        joinBtn.addEventListener('click', handleJoinChat);
        usernameEntryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleJoinChat();
        });

        sendBtn.addEventListener('click', sendMessage);
        reconnectBtn.addEventListener('click', connectWebSocket);

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        addMediaBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                addMediaInput(Array.from(e.target.files));
                fileInput.value = '';
            }
        });
    </script>
</body>
</html>
