<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RN + FastAPI WebSocket Client</title>
    <style>
        /* Reset and Base Styles to mimic Mobile App feel */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4ff;
        }

        /* Main Container (SafeAreaView equivalent) */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 16px;
            max-width: 600px; /* limit width on desktop to look like a phone */
            margin: 0 auto;
        }

        /* Typography */
        h1.title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
            text-align: center;
            color: #000;
        }

        .status {
            font-size: 14px;
            text-align: center;
            margin-bottom: 12px;
            color: #333;
        }

        /* Messages Area (FlatList equivalent) */
        #messages-container {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px;
            background-color: #ffffff;
            overflow-y: auto; /* Enables scrolling */
            display: flex;
            flex-direction: column;
        }

        /* Message Bubbles */
        .message-bubble {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message-from {
            font-size: 10px;
            opacity: 0.6;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .message-text {
            font-size: 14px;
        }

        /* Variant Styles */
        .msg-me {
            align-self: flex-end;
            background-color: #d4f8d4;
        }

        .msg-server {
            align-self: flex-start;
            background-color: #d4e4ff;
        }

        .msg-system {
            align-self: center;
            background-color: #fce5cd;
            font-style: italic;
        }

        /* Input Area */
        .input-row {
            display: flex;
            flex-direction: row;
            margin-top: 8px;
            align-items: center;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            border: 1px solid #aaa;
            border-radius: 6px;
            padding: 10px 8px; /* slightly larger padding for web touch targets */
            background-color: #ffffff;
            font-size: 16px; /* prevents zoom on mobile */
        }

        /* Specific style for username input to make it smaller */
        #username-input {
            flex: 0.4; /* Take up less space than message input */
            background-color: #fffbe6; /* Light yellow to distinguish it */
        }

        button {
            padding: 10px 16px;
            background-color: #007AFF; /* React Native generic blue */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            opacity: 0.7;
        }

        .button-row {
            margin-top: 8px;
        }

        .reconnect-btn {
            width: 100%;
            background-color: #2196F3;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <h1 class="title">React Native + FastAPI WebSocket</h1>
        <div class="status" id="status-text">Status: 😔 Disconnected</div>

        <div id="messages-container">
            </div>

        <div class="input-row">
            <input type="text" id="username-input" placeholder="Username" />
            </div>

        <div class="input-row">
            <input type="text" id="message-input" placeholder="Type a message..." />
            <button id="send-btn">Send</button>
        </div>

        <div class="button-row">
            <button id="reconnect-btn" class="reconnect-btn">Reconnect</button>
        </div>
    </div>

    <script>
        // --- Configuration ---
        
        // AUTOMATIC URL DETECTION
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.host; // Includes domain and port
        const WS_URL = `${protocol}//${host}/ws`;

        // --- State & DOM Elements ---
        let ws = null;
        let isConnected = false;

        const statusText = document.getElementById('status-text');
        const messagesContainer = document.getElementById('messages-container');
        const usernameInput = document.getElementById('username-input'); // <--- New
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const reconnectBtn = document.getElementById('reconnect-btn');

        // Set a random default username so they don't have to type one immediately
        usernameInput.value = "User" + Math.floor(Math.random() * 100);

        // --- Logic ---

        function updateStatus(connected) {
            isConnected = connected;
            statusText.textContent = connected ? "Status: 😃 Connected" : "Status: 😔 Disconnected";
        }

        function addMessage(from, text) {
            const bubble = document.createElement('div');
            
            // Determine class based on sender
            let variantClass = 'msg-system';
            if (from === 'me') variantClass = 'msg-me';
            if (from === 'server') variantClass = 'msg-server';

            bubble.className = `message-bubble ${variantClass}`;

            // Create inner HTML structure
            const fromSpan = document.createElement('span');
            fromSpan.className = 'message-from';
            fromSpan.textContent = from + ':';

            const textSpan = document.createElement('span');
            textSpan.className = 'message-text';
            textSpan.textContent = text;

            bubble.appendChild(fromSpan);
            bubble.appendChild(textSpan);

            // Append to list
            messagesContainer.appendChild(bubble);

            // Auto-scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function connectWebSocket() {
            if (ws) {
                ws.close();
            }

            console.log("Connecting to:", WS_URL);
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    updateStatus(true);
                    addMessage("system", "Connected to server");
                    
                    // --- START HEARTBEAT ---
                    ws.heartbeatInterval = setInterval(() => {
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ username: username, message: "ping" }));
                            console.log("♥ Sent heartbeat");
                        }
                    }, 20000); 
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);

                    if (data.message === "pong") return;

                    console.log("Received:", data);
                    addMessage(data.username, data.message);
                };

                ws.onerror = (error) => {
                    console.error("WebSocket error:", error);
                    addMessage("system", "WebSocket error (check console)");
                };

                ws.onclose = () => {
                    if (ws.heartbeatInterval) clearInterval(ws.heartbeatInterval);

                    console.log("WebSocket closed");
                    updateStatus(false);
                    addMessage("system", "Disconnected from server");
                };
            } catch (e) {
                console.error(e);
                addMessage("system", "Failed to create WebSocket connection");
            }
        }

        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage("system", "Not connected. Trying to reconnect...");
                connectWebSocket();
                return;
            }

            const text = messageInput.value.trim();
            const username = usernameInput.value.trim() || "Anonymous"; // Default if empty

            if (!text) return;

            // 1. Show the plain text locally (so it looks clean for me)
            addMessage("me", text);
            
            // 2. Send "Username: Message" to the server
            // The server will broadcast this full string to everyone else
            ws.send(JSON.stringify({ username: username, message: text }));

            // Clear input
            messageInput.value = "";
            messageInput.focus();
        }

        // --- Event Listeners ---

        window.addEventListener('load', connectWebSocket);

        window.addEventListener('beforeunload', () => {
            if (ws) ws.close();
        });

        sendBtn.addEventListener('click', sendMessage);
        reconnectBtn.addEventListener('click', connectWebSocket);

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

    </script>
</body>
</html>
